<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Tenses · loading…</title>
<style>
body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f0f4fa;color:#1a2332}
.box{text-align:center;padding:24px}
.spin{width:36px;height:36px;border:3px solid #c5d0de;border-top-color:#1565c0;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="spin"></div><div id="msg">Загрузка Simple Tenses…</div></div>
<script>
(async function () {
  const n = 5;
  try {
    const parts = [];
    for (let i = 0; i < n; i++) {
      const r = await fetch('p' + i + '.txt');
      if (!r.ok) throw new Error('chunk p' + i + ' ' + r.status);
      parts.push(await r.text());
    }
    const b64 = parts.join('');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const ds = new DecompressionStream('gzip');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById('msg').textContent = 'Ошибка: ' + e + ' — откройте Simple_Tenses_Interactive.html напрямую';
  }
})();
</script>
</body>
</html>
